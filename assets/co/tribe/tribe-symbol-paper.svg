<!--
  THE t.'s DOT, IN SIGNAL LIME. Kevin, answering Raj's 12 Aug ask (~30:30)
  about the wordmark's green dot: "The dot right after tribe in the tribe logo
  AND IN THE t. WORDMARK" — so this mark's full stop too, which is the second
  path here (raw bbox x 3855..5768, y 29..1930, bottom-right of the two).

  Flat lime, no hairline, for the same reason as tribe-wordmark-paper.svg: this
  is the on-dark variant and every place it is used sits on Ink — .ta-qr-mark
  at 26px on the QR panel, .icg-t at 16px inside the 32px ink coin of
  .ic-glyph, and the guide launcher's front face at 24px on bg-ink. Signal Lime
  on Ink is 14.9:1, so the dot carries on its own; a ring would only eat it.
  The dot is 28.1% of this mark's height, so it lands at 7.3px / 4.5px / 6.8px
  respectively — small, but lime at 14.9:1 does not need area the way lime on
  Paper does.

  Note for whoever comes next: the INK variant of this mark deliberately did
  NOT get the same change. See the comment in tribe-symbol-ink.svg.
-->
